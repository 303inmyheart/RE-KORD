# RE-KORD hub with Docker Compose.
#
#   docker compose up -d --build              (from the repository root)
#   open http://<host>:7420  (admin panel: http://<host>:7420/admin)
#
# Coming from 5.0: the port moves from 3001 to 7420 and the volumes change (/config → /data).
# See docs/upgrading-from-legacy.md.
services:
  rekord:
    build:
      context: .
      dockerfile: Dockerfile
    image: rekord:5.0.0
    container_name: rekord
    ports:
      - "${REKORD_PORT:-7420}:7420"
    environment:
      REKORD_BIND: 0.0.0.0:7420
      REKORD_DATA_DIR: /data
      REKORD_MUSIC_ROOT: /music
      # "Machine operations" (scan, library path, restore, tunnel) require a
      # local client. Inside the container every request comes from the Docker
      # network, so without this variable they must be done with
      #   docker exec rekord curl -X POST http://127.0.0.1:7420/api/v1/library/scan
      # With 1 the Default account can perform them from any client that reaches
      # the hub: enable it only on a network you trust.
      REKORD_ALLOW_REMOTE_ADMIN: ${REKORD_ALLOW_REMOTE_ADMIN:-0}
      # Extra web origins allowed by CORS (besides the hub's own and the Tauri clients).
      # REKORD_ALLOWED_ORIGINS: https://musica.example.org
      # REKORD_PUBLIC_URL: https://musica.example.org
      # ENABLE_YTDLP: "1"
      # REKORD_YTDLP_COOKIES: /data/youtube-cookies.txt
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # Database, settings, accounts. In 5.0 this was /config.
      - ${REKORD_DATA_HOST:-./docker-data/data}:/data
      # Music library (Artist/Album/track). Remove :ro if you use Studio/downloads.
      - ${REKORD_MUSIC_HOST:-./docker-data/music}:/music
    restart: unless-stopped
    # The container user has uid 10001: the mounted folders must be writable
    # by it (sudo chown -R 10001:10001 docker-data), or set your own
    # uid:gid here (id -u / id -g).
    # user: "1000:1000"
