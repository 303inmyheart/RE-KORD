[package]
name = "rekord-client"
version.workspace = true
description = "RE-KORD client shell"
edition.workspace = true
license.workspace = true

[features]
default = []
# "Server flavor": the desktop shell also starts the hub (rekord-core) in its own
# thread, like the Electron "Server" app did. Off by default and never on phones:
# on Android/iOS the dependencies below don't exist and the code is excluded.
#   pnpm build:client:server-flavor
hub = ["dep:rekord-core", "dep:tokio", "dep:anyhow"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# External links (re-kord.com, Cloudflare, Discogs...) in the system browser
# instead of inside the app window.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading the hub's QR code on first launch. Phone only: the plugin opens the
# system camera and doesn't exist on desktop, so it isn't even among the
# dependencies of the Linux/Windows binary.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Single window: a second launch brings the first one to the front.
tauri-plugin-single-instance = "2"
# "Save as" dialog for files generated in the page (backup, profile, theme).
tauri-plugin-dialog = "2"
rekord-core = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

# Native media controls (MPRIS, src/mpris.rs). Already in the tree through
# tauri-plugin-single-instance: no new crates.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[lib]
name = "rekord_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
