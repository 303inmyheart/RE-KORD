<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: il layout arriva sotto tacca e barre di sistema, e i
         bordi li recupera il CSS con env(safe-area-inset-*).
         interactive-widget=overlays-content: la tastiera copre la pagina invece di
         schiacciarla, così la cromatura fissa non salta; chi deve stare sopra la
         tastiera usa --rk-app-vh (vedi lib/viewportMetrics.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#0a0e14" />
    <title>RE-KORD</title>
    <meta name="description" content="RE-KORD — la tua musica, dal tuo hub." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- PWA: solo il client servito dall'hub la usa (vedi src/lib/platform/pwa.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Nessun font da Google Fonts: l'hub e i gusci nativi devono funzionare
         senza Internet (e la CSP di Tauri non lo permetterebbe). Inter e
         JetBrains Mono arrivano col pacchetto (packages/ui/src/styles/fonts.css);
         qui si anticipa solo Inter latino, l'unico file che serve al primo paint. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../../packages/ui/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
